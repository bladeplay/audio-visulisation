<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Voice & Audio Concert Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        cyber: {
                            cyan: '#00f3ff',
                            magenta: '#ff0055',
                            purple: '#9d00ff',
                            dark: '#0a0a12',
                            panel: '#121220'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .glow-box {
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.1), inset 0 0 15px rgba(0, 243, 255, 0.03);
        }
        .glow-box-magenta {
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.1), inset 0 0 15px rgba(255, 0, 85, 0.03);
        }
        /* Mobile touch highlights */
        * {
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom styled Range Sliders */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00f3ff;
            cursor: pointer;
            box-shadow: 0 0 8px #00f3ff;
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #00f3ff;
            cursor: pointer;
            box-shadow: 0 0 8px #00f3ff;
            border: none;
        }
    </style>
</head>
<body id="bodyFrame" class="h-full flex flex-col font-sans overflow-hidden antialiased select-none bg-[#030206] transition-colors duration-200">

    <!-- Header -->
    <header class="border-b border-slate-900/60 bg-slate-950/80 backdrop-blur-md px-4 py-3 sm:px-8 z-20">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2.5">
                <div class="p-1.5 bg-cyan-500/10 border border-cyan-500/20 rounded-lg text-cyan-400">
                    <i data-lucide="music-4" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500">
                        SONIC<span class="text-white font-light">SPECTRUM</span>
                    </h1>
                </div>
            </div>

            <!-- Status Indicator -->
            <div id="statusBadge" class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full border border-slate-900 bg-slate-900/40 text-[10px] sm:text-xs font-medium text-slate-400">
                <span class="w-1.5 h-1.5 rounded-full bg-slate-500 transition-all duration-300" id="statusDot"></span>
                <span id="statusText">System Idle</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 flex flex-col max-w-7xl w-full mx-auto p-2 sm:p-6 gap-3 overflow-hidden">
        
        <!-- Live Action Canvas Area -->
        <div id="canvasContainer" class="relative flex-1 bg-[#06050a]/95 rounded-2xl border border-cyan-500/20 glow-box overflow-hidden flex items-center justify-center transition-all duration-500">
            
            <!-- Real-time Canvas -->
            <canvas id="visualizerCanvas" class="absolute inset-0 w-full h-full block z-10"></canvas>

            <!-- Decibel Peak Meter Bar overlay at bottom of canvas -->
            <div class="absolute bottom-2.5 left-3 right-3 bg-slate-900/60 backdrop-blur border border-slate-800/40 rounded-full h-1.5 p-0.5 overflow-hidden flex items-center z-10">
                <div id="inputLevelBar" class="h-full bg-gradient-to-r from-emerald-400 via-cyan-400 to-pink-500 rounded-full w-0 transition-all duration-75"></div>
            </div>

            <!-- On-Screen Play/Instructions Overlay -->
            <div id="placeholderOverlay" class="absolute inset-0 flex flex-col items-center justify-center p-4 text-center z-20 transition-opacity duration-300 bg-slate-950/40">
                <div class="p-3 rounded-full bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 mb-3 animate-pulse">
                    <i data-lucide="play" class="w-6 h-6"></i>
                </div>
                <h2 class="text-sm sm:text-base font-semibold text-slate-200">Start the Experience</h2>
                <p class="text-[10px] sm:text-xs text-slate-400 max-w-xs mt-1">Tap a source below to stream audio</p>
            </div>

            <!-- Error Popups -->
            <div id="errorOverlay" class="hidden absolute inset-0 bg-slate-950/95 z-30 flex flex-col items-center justify-center p-5 text-center overflow-y-auto">
                <div class="p-3 rounded-full bg-pink-500/10 border border-pink-500/20 text-pink-500 mb-2">
                    <i data-lucide="shield-alert" class="w-6 h-6 animate-bounce"></i>
                </div>
                <h3 class="text-sm sm:text-base font-bold text-pink-400" id="errorTitle">Notice</h3>
                <div class="text-[11px] sm:text-xs text-slate-300 max-w-sm mt-2 mb-4 text-left bg-slate-900/90 p-3 rounded-lg border border-slate-800 space-y-1.5" id="errorDetailBlock"></div>
                <button id="dismissError" class="px-4 py-1.5 rounded-md bg-slate-800 border border-slate-700 text-xs text-slate-200 hover:bg-slate-700 active:scale-95">Dismiss</button>
            </div>
        </div>

        <!-- Mobile Controls Stack -->
        <div class="flex flex-col gap-2 z-20">
            
            <!-- Audio Input Panel -->
            <div class="flex items-center gap-1.5 bg-slate-900/60 p-2 rounded-xl border border-slate-900/80">
                <button id="toggleMicBtn" class="flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-lg font-bold text-xs transition-all bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 active:scale-95 shadow-md">
                    <i data-lucide="mic" id="micIcon" class="w-3.5 h-3.5"></i>
                    <span id="micBtnText">Use Microphone</span>
                </button>

                <div class="flex-1 relative">
                    <input type="file" id="audioFileInput" accept="audio/*" class="hidden">
                    <button id="fileBtn" class="w-full flex items-center justify-center gap-1.5 py-2.5 rounded-lg font-bold text-xs transition-all bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 active:scale-95">
                        <i data-lucide="music" class="w-3.5 h-3.5"></i>
                        <span id="fileBtnText">Load Audio File</span>
                    </button>
                </div>
                
                <button id="freezeBtn" disabled class="p-2.5 rounded-lg border border-slate-800 bg-slate-800 text-slate-400 hover:text-white disabled:opacity-30 transition" title="Freeze frame">
                    <i data-lucide="pause" id="freezeIcon" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Visualization Presets -->
            <div class="grid grid-cols-4 gap-1">
                <button data-mode="bars" class="mode-btn active py-2 rounded-lg border border-cyan-500/30 bg-slate-900/40 text-[10px] font-bold text-cyan-300 flex flex-col items-center justify-center gap-1 transition active:scale-95">
                    <i data-lucide="bar-chart-3" class="w-4 h-4"></i> Bars
                </button>
                <button data-mode="wave" class="mode-btn py-2 rounded-lg border border-slate-900 bg-slate-900/40 text-[10px] font-bold text-slate-400 flex flex-col items-center justify-center gap-1 transition active:scale-95">
                    <i data-lucide="waves" class="w-4 h-4"></i> Wave
                </button>
                <button data-mode="radial" class="mode-btn py-2 rounded-lg border border-slate-900 bg-slate-900/40 text-[10px] font-bold text-slate-400 flex flex-col items-center justify-center gap-1 transition active:scale-95">
                    <i data-lucide="disc" class="w-4 h-4"></i> Radial
                </button>
                <button data-mode="particles" class="mode-btn py-2 rounded-lg border border-slate-900 bg-slate-900/40 text-[10px] font-bold text-slate-400 flex flex-col items-center justify-center gap-1 transition active:scale-95">
                    <i data-lucide="sparkles" class="w-4 h-4"></i> Particles
                </button>
            </div>

            <!-- Expandable Settings Bar (Tailored for mobile) -->
            <div class="bg-slate-900/60 rounded-xl border border-slate-900/80 overflow-hidden">
                <button id="settingsHeaderBtn" class="w-full flex items-center justify-between px-3 py-2 text-xs font-bold text-slate-400 hover:text-slate-200">
                    <span class="flex items-center gap-1.5">
                        <i data-lucide="sliders" class="w-3.5 h-3.5 text-cyan-400"></i> Adjustments & Concert Options
                    </span>
                    <i data-lucide="chevron-down" id="settingsChevron" class="w-4 h-4 transition-transform duration-200"></i>
                </button>

                <!-- Hidden Settings Container on Startup -->
                <div id="settingsExpandedPanel" class="max-h-0 opacity-0 transition-all duration-300 ease-in-out px-3 pb-3 space-y-3">
                    
                    <!-- Concert lighting and effects -->
                    <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800">
                        <div class="p-2 bg-cyan-950/20 border border-cyan-500/10 rounded-lg">
                            <label class="flex items-center justify-between text-[11px] font-bold text-cyan-400 cursor-pointer">
                                <span class="flex items-center gap-1">
                                    <i data-lucide="lightbulb" class="w-3.5 h-3.5 text-yellow-400"></i> Concert Light
                                </span>
                                <input type="checkbox" id="concertLightToggle" class="w-3.5 h-3.5 accent-cyan-400 rounded cursor-pointer">
                            </label>
                        </div>
                        <div class="p-2 bg-slate-950/40 border border-slate-800 rounded-lg">
                            <label class="flex items-center justify-between text-[11px] font-bold text-slate-400 cursor-pointer">
                                <span>Neon Glow</span>
                                <input type="checkbox" id="glowToggle" checked class="w-3.5 h-3.5 accent-cyan-400 rounded cursor-pointer">
                            </label>
                        </div>
                    </div>

                    <!-- Themes -->
                    <div class="space-y-1">
                        <div class="flex justify-between text-[10px] text-slate-400">
                            <span>Color Scheme</span>
                            <span id="currentThemeName" class="text-cyan-400 font-bold">Cyberpunk</span>
                        </div>
                        <div class="grid grid-cols-4 gap-1">
                            <button data-theme="cyberpunk" class="theme-btn active border-2 border-cyan-400 h-6 rounded-lg bg-gradient-to-r from-cyan-400 to-pink-500 shadow-sm" title="Cyberpunk"></button>
                            <button data-theme="neon" class="theme-btn border border-slate-700 h-6 rounded-lg bg-gradient-to-r from-green-400 to-emerald-600 shadow-sm" title="Neon Green"></button>
                            <button data-theme="sunset" class="theme-btn border border-slate-700 h-6 rounded-lg bg-gradient-to-r from-amber-400 via-rose-500 to-purple-600 shadow-sm" title="Sunset Fire"></button>
                            <button data-theme="monochrome" class="theme-btn border border-slate-700 h-6 rounded-lg bg-gradient-to-r from-slate-200 to-slate-500 shadow-sm" title="Monochrome"></button>
                        </div>
                    </div>

                    <!-- Slider Adjustments -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                        <div class="space-y-0.5">
                            <div class="flex justify-between text-[10px] text-slate-400">
                                <span>Sensitivity Gain</span>
                                <span id="gainVal" class="text-cyan-400 font-mono">1.5x</span>
                            </div>
                            <input type="range" id="gainControl" min="0.5" max="4.0" step="0.1" value="1.5" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer">
                        </div>

                        <div class="space-y-0.5">
                            <div class="flex justify-between text-[10px] text-slate-400">
                                <span>Signal Smoothing</span>
                                <span id="smoothingVal" class="text-cyan-400 font-mono">0.85</span>
                            </div>
                            <input type="range" id="smoothingControl" min="0.1" max="0.95" step="0.05" value="0.85" class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer">
                        </div>
                    </div>

                    <!-- FFT Resolution -->
                    <div class="space-y-0.5">
                        <div class="flex justify-between text-[10px] text-slate-400">
                            <span>FFT Resolution (Bars)</span>
                            <span id="fftVal" class="text-cyan-400 font-mono">128</span>
                        </div>
                        <select id="fftSelect" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-2 py-1 text-[11px] text-slate-300 focus:outline-none">
                            <option value="64">64 (Fast on Mobile)</option>
                            <option value="128" selected>128 (Balanced)</option>
                            <option value="256">256 (High Detail)</option>
                        </select>
                    </div>

                </div>
            </div>

            <!-- Playing Track Overlay Indicator -->
            <div id="playingTrackIndicator" class="hidden flex items-center justify-between p-2.5 bg-cyan-950/20 border border-cyan-500/20 rounded-xl text-xs">
                <span class="flex items-center gap-1.5 text-cyan-400 truncate pr-4">
                    <i data-lucide="disc" class="w-4 h-4 animate-spin"></i>
                    <span id="currentTrackLabel" class="truncate font-medium">Track</span>
                </span>
                <span id="peakDb" class="font-mono text-[10px] text-slate-400 shrink-0">PEAK: -INF dB</span>
            </div>

        </div>
    </main>

    <script>
        lucide.createIcons();

        const state = {
            isListening: false,
            isFrozen: false,
            activeSource: null,
            mode: 'bars',
            theme: 'cyberpunk',
            gain: 1.5,
            fftSize: 128,
            smoothing: 0.85,
            glow: true,
            mirror: true,
            concertLight: false,
            bgCycleHue: 0 // Base hue value for dynamic background cycle
        };

        if (window.innerWidth < 640) {
            state.fftSize = 64; 
            document.getElementById('fftSelect').value = "64";
            document.getElementById('fftVal').textContent = "64";
        }

        const themes = {
            cyberpunk: {
                name: 'Cyberpunk',
                primary: '#00f3ff',
                secondary: '#ff0055',
                tertiary: '#9d00ff',
                bgGlow: 'rgba(0, 243, 255, 0.15)',
                getGradient: (ctx, h) => {
                    const g = ctx.createLinearGradient(0, h, 0, 0);
                    g.addColorStop(0, '#9d00ff');
                    g.addColorStop(0.5, '#ff0055');
                    g.addColorStop(1, '#00f3ff');
                    return g;
                }
            },
            neon: {
                name: 'Neon Green',
                primary: '#10b981',
                secondary: '#34d399',
                tertiary: '#059669',
                bgGlow: 'rgba(16, 185, 129, 0.15)',
                getGradient: (ctx, h) => {
                    const g = ctx.createLinearGradient(0, h, 0, 0);
                    g.addColorStop(0, '#064e3b');
                    g.addColorStop(0.5, '#10b981');
                    g.addColorStop(1, '#a7f3d0');
                    return g;
                }
            },
            sunset: {
                name: 'Sunset Fire',
                primary: '#f59e0b',
                secondary: '#f43f5e',
                tertiary: '#8b5cf6',
                bgGlow: 'rgba(245, 158, 11, 0.15)',
                getGradient: (ctx, h) => {
                    const g = ctx.createLinearGradient(0, h, 0, 0);
                    g.addColorStop(0, '#8b5cf6');
                    g.addColorStop(0.5, '#f43f5e');
                    g.addColorStop(1, '#fef08a');
                    return g;
                }
            },
            monochrome: {
                name: 'Monochrome',
                primary: '#f8fafc',
                secondary: '#94a3b8',
                tertiary: '#334155',
                bgGlow: 'rgba(255, 255, 255, 0.1)',
                getGradient: (ctx, h) => {
                    const g = ctx.createLinearGradient(0, h, 0, 0);
                    g.addColorStop(0, '#334155');
                    g.addColorStop(0.5, '#94a3b8');
                    g.addColorStop(1, '#f8fafc');
                    return g;
                }
            }
        };

        let audioCtx = null;
        let analyserNode = null;
        let gainNode = null;
        let micStream = null;
        let micSourceNode = null;
        let fileSourceNode = null;
        let audioPlayNode = null;
        let animationFrameId = null;

        const bodyFrame = document.getElementById('bodyFrame');
        const canvas = document.getElementById('visualizerCanvas');
        const ctx = canvas.getContext('2d');
        const canvasContainer = document.getElementById('canvasContainer');

        function resizeCanvas() {
            const rect = canvasContainer.getBoundingClientRect();
            const pixelRatio = Math.min(window.devicePixelRatio, 2);
            canvas.width = rect.width * pixelRatio;
            canvas.height = rect.height * pixelRatio;
            ctx.resetTransform();
            ctx.scale(pixelRatio, pixelRatio);
        }
        
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const toggleMicBtn = document.getElementById('toggleMicBtn');
        const micIcon = document.getElementById('micIcon');
        const micBtnText = document.getElementById('micBtnText');
        
        const audioFileInput = document.getElementById('audioFileInput');
        const fileBtn = document.getElementById('fileBtn');
        const fileBtnText = document.getElementById('fileBtnText');
        const playingTrackIndicator = document.getElementById('playingTrackIndicator');
        const currentTrackLabel = document.getElementById('currentTrackLabel');

        const freezeBtn = document.getElementById('freezeBtn');
        const freezeIcon = document.getElementById('freezeIcon');
        const placeholderOverlay = document.getElementById('placeholderOverlay');
        const errorOverlay = document.getElementById('errorOverlay');
        const errorTitle = document.getElementById('errorTitle');
        const errorDetailBlock = document.getElementById('errorDetailBlock');
        const dismissError = document.getElementById('dismissError');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const peakDb = document.getElementById('peakDb');
        const inputLevelBar = document.getElementById('inputLevelBar');

        const gainControl = document.getElementById('gainControl');
        const gainVal = document.getElementById('gainVal');
        const fftSelect = document.getElementById('fftSelect');
        const fftVal = document.getElementById('fftVal');
        const smoothingControl = document.getElementById('smoothingControl');
        const smoothingVal = document.getElementById('smoothingVal');
        const glowToggle = document.getElementById('glowToggle');
        const concertLightToggle = document.getElementById('concertLightToggle');

        // Settings expandable toggle logic
        const settingsHeaderBtn = document.getElementById('settingsHeaderBtn');
        const settingsChevron = document.getElementById('settingsChevron');
        const settingsExpandedPanel = document.getElementById('settingsExpandedPanel');

        settingsHeaderBtn.addEventListener('click', () => {
            const isOpened = settingsExpandedPanel.style.maxHeight && settingsExpandedPanel.style.maxHeight !== '0px';
            if (isOpened) {
                settingsExpandedPanel.style.maxHeight = '0px';
                settingsExpandedPanel.style.opacity = '0';
                settingsChevron.style.transform = 'rotate(0deg)';
            } else {
                settingsExpandedPanel.style.maxHeight = '500px';
                settingsExpandedPanel.style.opacity = '1';
                settingsChevron.style.transform = 'rotate(180deg)';
            }
        });

        let particles = [];
        let peakCaps = [];

        function initAudioEngine() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyserNode = audioCtx.createAnalyser();
                gainNode = audioCtx.createGain();
                
                analyserNode.fftSize = parseInt(state.fftSize) * 2; 
                analyserNode.smoothingTimeConstant = parseFloat(state.smoothing);
                gainNode.gain.value = parseFloat(state.gain);

                gainNode.connect(analyserNode);
            }
        }

        async function startMicrophone() {
            initAudioEngine();
            disconnectFileSource();

            if (window.isSecureContext === false) {
                showDiagnosticError(
                    "Insecure Context Detected",
                    `Microphone access is blocked by your browser because this site is loaded over HTTP or an untrusted IP address.
                    <br><br><b>How to fix:</b>
                    <ul class="list-disc pl-4 mt-1 space-y-1">
                        <li>On Laptop: Open via <code>http://localhost:...</code> or <code>file:///</code>.</li>
                        <li>On Phone: You must serve this page via <b>HTTPS</b> (e.g. upload to GitHub Pages or Vercel).</li>
                    </ul>`
                );
                return;
            }

            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                showDiagnosticError(
                    "Browser Not Supported",
                    `Your current browser or in-app webview does not support <code>getUserMedia</code>. Open directly in Safari (iOS) or Chrome (Android).`
                );
                return;
            }

            try {
                if (audioCtx.state === 'suspended') {
                    await audioCtx.resume();
                }

                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ 
                        audio: { echoCancellation: true, noiseSuppression: true } 
                    });
                } catch (firstErr) {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                }

                micSourceNode = audioCtx.createMediaStreamSource(micStream);
                micSourceNode.connect(gainNode);

                state.isListening = true;
                state.activeSource = 'mic';
                updateSourceUI();
                placeholderOverlay.classList.add('opacity-0', 'pointer-events-none');
                errorOverlay.classList.add('hidden');
                freezeBtn.disabled = false;

                resizeCanvas();
                draw();

            } catch (err) {
                console.error("Mic Access Error:", err);
                let explanation = "";
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    explanation = `
                        <b>Browser has blocked access.</b>
                        <ul class="list-disc pl-4 mt-1.5 space-y-1">
                            <li><b>On Laptop:</b> Click the lock icon next to the URL and toggle Microphone to <b>Allow</b>.</li>
                            <li><b>On iPhone:</b> Go to Settings ➔ Safari ➔ Microphone ➔ Set to "Allow".</li>
                            <li><b>On Android:</b> Go to Settings ➔ Apps ➔ Chrome ➔ Permissions ➔ Microphone ➔ Allow.</li>
                        </ul>
                    `;
                } else {
                    explanation = `Error details: ${err.message || err.name}`;
                }
                showDiagnosticError("Mic Permission Blocked", explanation);
                stopAllAudio();
            }
        }

        function showDiagnosticError(title, htmlContent) {
            errorTitle.textContent = title;
            errorDetailBlock.innerHTML = htmlContent;
            errorOverlay.classList.remove('hidden');
        }

        function disconnectFileSource() {
            if (audioPlayNode) {
                try { audioPlayNode.stop(); } catch(e) {}
                audioPlayNode = null;
            }
            if (fileSourceNode) {
                fileSourceNode.disconnect();
                fileSourceNode = null;
            }
            playingTrackIndicator.classList.add('hidden');
            fileBtn.className = "w-full flex items-center justify-center gap-1.5 py-2.5 rounded-lg font-bold text-xs transition-all bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 active:scale-95";
            fileBtnText.textContent = "Load Audio File";
        }

        function disconnectMicSource() {
            if (micStream) {
                micStream.getTracks().forEach(track => track.stop());
                micStream = null;
            }
            if (micSourceNode) {
                micSourceNode.disconnect();
                micSourceNode = null;
            }
            toggleMicBtn.className = "flex-1 flex items-center justify-center gap-1.5 py-2.5 rounded-lg font-bold text-xs transition-all bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 active:scale-95 shadow-md";
            micBtnText.textContent = "Use Microphone";
        }

        function stopAllAudio() {
            disconnectMicSource();
            disconnectFileSource();

            state.isListening = false;
            state.isFrozen = false;
            state.activeSource = null;
            
            updateSourceUI();
            placeholderOverlay.classList.remove('opacity-0', 'pointer-events-none');
            freezeBtn.disabled = true;
            inputLevelBar.style.width = '0%';
            bodyFrame.style.backgroundColor = '';
            
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            clearCanvas();
        }

        audioFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            initAudioEngine();
            disconnectMicSource();
            disconnectFileSource();

            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    statusText.textContent = "Decoding track...";
                    const buffer = await audioCtx.decodeAudioData(event.target.result);
                    
                    audioPlayNode = audioCtx.createBufferSource();
                    audioPlayNode.buffer = buffer;
                    audioPlayNode.connect(gainNode);
                    audioPlayNode.connect(audioCtx.destination);

                    audioPlayNode.onended = () => stopAllAudio();
                    audioPlayNode.start(0);

                    state.isListening = true;
                    state.activeSource = 'file';
                    
                    currentTrackLabel.textContent = file.name;
                    playingTrackIndicator.classList.remove('hidden');
                    updateSourceUI();

                    placeholderOverlay.classList.add('opacity-0', 'pointer-events-none');
                    errorOverlay.classList.add('hidden');
                    freezeBtn.disabled = false;

                    resizeCanvas();
                    draw();

                } catch (err) {
                    showDiagnosticError("Decoding Error", "Could not decode audio. Try playing an MP3 or WAV format.");
                    stopAllAudio();
                }
            };
            reader.readAsArrayBuffer(file);
        });

            if (state.activeSource === 'mic') {

                micBtnText.textContent = "Stop Mic";

                statusDot.className = "w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping";
                statusText.textContent = "Listening Live";
                statusText.className = "text-cyan-400";
            } else if (state.activeSource === 'file') {
                fileBtn.className = "w-full flex items-center justify-center gap-1.5 py-2.5 rounded-lg font-bold text-xs transition-all bg-gradient-to-r from-pink-500 to-rose-600 text-white active:scale-95";
                fileBtnText.textContent = "Stop Track";

                statusDot.className = "w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping";
                statusText.textContent = "Playing File";
                statusText.className = "text-emerald-400";
            } else {
                statusDot.className = "w-1.5 h-1.5 rounded-full bg-slate-500";
                statusText.textContent = "System Idle";
                statusText.className = "text-slate-400";
            }
            lucide.createIcons();
        }

        function clearCanvas() {
            const w = canvas.width / window.devicePixelRatio;
            const h = canvas.height / window.devicePixelRatio;
            ctx.clearRect(0, 0, w, h);
        }

        function draw() {
            if (!state.isListening) return;

            animationFrameId = requestAnimationFrame(draw);

            if (state.isFrozen) return;

            const w = canvas.width / window.devicePixelRatio;
            const h = canvas.height / window.devicePixelRatio;

            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            if (state.mode === 'wave') {
                analyserNode.getByteTimeDomainData(dataArray);
            } else {
                analyserNode.getByteFrequencyData(dataArray);
            }

            // Calculate RMS Sound Volume Level for Decibel meter
            let maxVal = 0;
            let sumSquares = 0;
            for (let i = 0; i < bufferLength; i++) {
                if (dataArray[i] > maxVal) maxVal = dataArray[i];
                if (state.mode === 'wave') {
                    const normalized = (dataArray[i] - 128) / 128;
                    sumSquares += normalized * normalized;
                } else {
                    const normalized = dataArray[i] / 255;
                    sumSquares += normalized * normalized;
                }
            }

            const rms = Math.sqrt(sumSquares / bufferLength);
            const levelPct = Math.min(100, Math.round(rms * 150));
            inputLevelBar.style.width = `${levelPct}%`;

            const db = maxVal > 0 ? Math.round(20 * Math.log10(maxVal / 255)) : -Infinity;
            const liveDbStr = db === -Infinity ? '-INF dB' : `${db} dB`;
            const statsPeakBox = document.getElementById('peakDb');
            if (statsPeakBox) statsPeakBox.textContent = `PEAK: ${liveDbStr}`;

            // Focus on low-frequency bass bins (index 0 to 4)
            let bassSum = 0;
            const bassBins = Math.min(4, bufferLength);
            for (let i = 0; i < bassBins; i++) {
                bassSum += dataArray[i];
            }
            const bassIntensity = (bassSum / bassBins) / 255;

            // --- Immersive Dynamic Background Processing ---
            state.bgCycleHue = (state.bgCycleHue + 0.3) % 360; // Slow, continuous color cycling

            // Create a radial background fill on the canvas that cycles colors
            const themeColors = themes[state.theme];
            let activeColor1, activeColor2;

            if (state.theme === 'monochrome') {
                activeColor1 = `hsla(0, 0%, ${10 + (bassIntensity * 15)}%, 1)`;
                activeColor2 = `hsla(0, 0%, 2%, 1)`;
            } else {
                // Determine hue values dynamically matching theme or cycling
                let hueValue = state.bgCycleHue;
                if (state.theme === 'neon') hueValue = 140 + (bassIntensity * 30); // Dynamic green shift
                if (state.theme === 'sunset') hueValue = 10 + (bassIntensity * 40); // Dynamic fiery orange shift

                // Intensify opacity & size with the bass hits
                activeColor1 = `hsla(${hueValue}, 80%, ${8 + (bassIntensity * 12)}%, 1)`;
                activeColor2 = `hsla(${hueValue}, 90%, 1%, 1)`;
            }

            const gradBg = ctx.createRadialGradient(w / 2, h / 2, 5, w / 2, h / 2, Math.max(w, h) * (0.4 + bassIntensity * 0.25));
            gradBg.addColorStop(0, activeColor1);
            gradBg.addColorStop(1, activeColor2);

            ctx.fillStyle = gradBg;
            ctx.fillRect(0, 0, w, h);

            // Strobe Concert lighting back-fill outside the canvas container
            if (state.concertLight && state.mode !== 'wave') {
                if (bassIntensity > 0.35) {
                    const hexAlpha = Math.round(bassIntensity * 110).toString(16).padStart(2, '0');
                    bodyFrame.style.backgroundColor = `${themeColors.primary}${hexAlpha}`;
                } else {
                    bodyFrame.style.backgroundColor = '#030206';
                }
            } else {
                bodyFrame.style.backgroundColor = '';
            }

            switch (state.mode) {
                case 'bars':
                    renderBars(dataArray, bufferLength, w, h);
                    break;
                case 'wave':
                    renderWaveform(dataArray, bufferLength, w, h);
                    break;
                case 'radial':
                    renderRadial(dataArray, bufferLength, w, h);
                    break;
                case 'particles':
                    renderParticles(dataArray, bufferLength, w, h);
