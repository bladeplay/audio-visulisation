<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Φ // PURE 2D GOLDEN SPIRAL DSP</title>
  <style>
    :root {
      --bg: #050507;
      --panel: rgba(11, 11, 16, 0.76);
      --border: rgba(230, 198, 98, 0.22);
      --gold: #ecc964;
      --cyan: #5ce1e6;
      --crimson: #ff4d6d;
      --text: #f2f2f5;
      --muted: #72727e;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      overflow: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Subtle CRT / Vignette Overlay */
    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 45%, rgba(2, 2, 4, 0.85) 100%);
      z-index: 2;
    }

    /* Top HUD */
    .hud-top {
      position: fixed;
      top: 24px;
      left: 28px;
      right: 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 10;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: var(--panel);
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      backdrop-filter: blur(12px);
    }

    .brand-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      transition: all 0.25s ease;
    }

    .status-dot.active {
      background: var(--gold);
      box-shadow: 0 0 12px var(--gold), 0 0 24px var(--gold);
    }

    .brand-sub {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.14em;
    }

    .badge-row {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }

    .badge {
      font-size: 8px;
      padding: 2px 6px;
      border-radius: 3px;
      background: rgba(236, 201, 100, 0.12);
      border: 1px solid rgba(236, 201, 100, 0.3);
      color: var(--gold);
      letter-spacing: 0.12em;
    }

    /* Right Telemetry Matrix */
    .telemetry {
      display: grid;
      grid-template-columns: auto auto;
      gap: 4px 16px;
      font-size: 10px;
      line-height: 1.5;
      color: var(--muted);
      letter-spacing: 0.1em;
      background: var(--panel);
      padding: 12px 16px;
      border: 1px solid var(--border);
      border-radius: 6px;
      backdrop-filter: blur(12px);
      text-align: right;
    }

    .telemetry .label {
      text-align: left;
      color: var(--muted);
    }

    .telemetry .val {
      color: var(--gold);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    /* Bottom Control Dock */
    .hud-bottom {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      backdrop-filter: blur(16px);
      z-index: 10;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    }

    button, .file-label {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      padding: 7px 12px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    button:hover, .file-label:hover {
      border-color: var(--gold);
      color: var(--gold);
      background: rgba(236, 201, 100, 0.08);
    }

    button.active {
      background: rgba(236, 201, 100, 0.18);
      border-color: var(--gold);
      color: var(--gold);
      box-shadow: 0 0 15px rgba(236, 201, 100, 0.18);
    }

    input[type="file"] {
      display: none;
    }

    .divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.1);
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 0.12em;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 68px;
      height: 2px;
      background: rgba(255, 255, 255, 0.16);
      outline: none;
      transition: opacity 0.2s;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--gold);
      cursor: pointer;
      box-shadow: 0 0 8px var(--gold);
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>
  <div class="vignette"></div>

  <div class="hud-top">
    <div class="brand">
      <div class="brand-title">
        <div class="status-dot" id="statusDot"></div>
        <span>Φ // PHYLLOTAXIS ENGINE v2.6</span>
      </div>
      <div class="brand-sub">2D GOLDEN SPIRAL + MINIMALIST SPECTRAL TOPOLOGY</div>
      <div class="badge-row">
        <span class="badge" id="badgeAuto">AGC AUTO-TUNE: ON</span>
        <span class="badge" id="badgeBeat">TRANSIENT: IDLE</span>
      </div>
    </div>

    <div class="telemetry">
      <div class="label">DIVERGENCE ∠</div><div class="val" id="telAngle">137.5078°</div>
      <div class="label">SUB / BASS FLUX</div><div class="val" id="telBass">0.0%</div>
      <div class="label">SPECTRAL CENTROID</div><div class="val" id="telCentroid">0.0%</div>
      <div class="label">AUTO NODES [F_n]</div><div class="val" id="telNodes">480</div>
      <div class="label">ACTIVE LINKS</div><div class="val" id="telZ">0</div>
    </div>
  </div>

  <div class="hud-bottom">
    <button id="btnSynth" title="Polyphonic Golden Ratio Harmonic Drone & Polyrhythm">Φ Synth v2</button>
    <button id="btnMic" title="Live Microphone Input">Mic In</button>
    <label class="file-label" title="Load Local Audio Track">
      Audio File
      <input type="file" id="audioFile" accept="audio/*" />
    </label>

    <div class="divider"></div>

    <button id="btnAuto" class="active" title="Automatically optimize node density and tension">Auto-Tune: ON</button>
    <button id="btnTheme" title="Switch Harmonic Color Palette">Theme: Aurum</button>

    <div class="divider"></div>

    <div class="control-group">
      <span>NODES</span>
      <input type="range" id="nodeSlider" min="233" max="780" value="480" />
    </div>

    <div class="control-group">
      <span>TENSION</span>
      <input type="range" id="tensionSlider" min="10" max="100" value="62" />
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      // Sacred Geometry Constants
      const PHI = (1 + Math.sqrt(5)) / 2;
      const INV_PHI = 1 / PHI;
      const GOLDEN_ANGLE = Math.PI * 2 * (1 - INV_PHI);
      const LOG_PHI = Math.log(PHI) / (Math.PI / 2);

      // Color Palettes
      const THEMES = [
        {
          name: 'Aurum',
          primary: [236, 201, 100],   // Imperial Gold
          secondary: [255, 140, 66],  // Warm Amber
          accent: [255, 250, 225]     // Starlight Core
        },
        {
          name: 'Aether',
          primary: [92, 225, 230],    // Cyber Cyan
          secondary: [138, 92, 245],  // Deep Violet
          accent: [230, 255, 255]     // Ice Core
        },
        {
          name: 'Solaris',
          primary: [255, 77, 109],    // Crimson Pulse
          secondary: [247, 184, 1],   // Solar Gold
          accent: [255, 235, 240]     // White-Hot Core
        }
      ];
      let themeIdx = 0;

      // Viewport State
      let width, height, cx, cy, minDim;

      // Auto-Tuned Parameters
      let autoTune = true;
      let nodeCount = 480;
      let targetNodes = 480;
      let tension = 0.62;
      let targetTension = 0.62;
      let phase = 0;

      // Audio DSP & Beat Detection State
      let audioCtx = null;
      let analyser = null;
      let freqData = new Uint8Array(1024);
      let timeData = new Uint8Array(1024);
      let activeSourceType = null;
      let micStream = null;
      let synthNodes = [];
      let synthTimer = null;
      let audioElement = null;

      // Smooth Envelope Followers
      let smoothBass = 0, smoothMid = 0, smoothHigh = 0, smoothCentroid = 0;
      let audioGate = 0; 
      let energyHistory = new Array(40).fill(0.05);
      let beatCooldown = 0;
      let beatFlash = 0;

      // UI References
      const statusDot = document.getElementById('statusDot');
      const badgeAuto = document.getElementById('badgeAuto');
      const badgeBeat = document.getElementById('badgeBeat');
      const telAngle = document.getElementById('telAngle');
      const telBass = document.getElementById('telBass');
      const telCentroid = document.getElementById('telCentroid');
      const telNodes = document.getElementById('telNodes');
      const telZ = document.getElementById('telZ');

      const btnSynth = document.getElementById('btnSynth');
      const btnMic = document.getElementById('btnMic');
      const audioFileInput = document.getElementById('audioFile');
      const btnAuto = document.getElementById('btnAuto');
      const btnTheme = document.getElementById('btnTheme');
      const nodeSlider = document.getElementById('nodeSlider');
      const tensionSlider = document.getElementById('tensionSlider');

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        cx = width / 2;
        cy = height / 2;
        minDim = Math.min(width, height);
      }
      window.addEventListener('resize', resize);
      resize();

      function initAudio() {
        if (!audioCtx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          audioCtx = new AudioContext();
          analyser = audioCtx.createAnalyser();
          analyser.fftSize = 2048;
          analyser.smoothingTimeConstant = 0.78;
          freqData = new Uint8Array(analyser.frequencyBinCount);
          timeData = new Uint8Array(analyser.frequencyBinCount);
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }

      function stopCurrentAudio() {
        synthNodes.forEach(n => {
          try { n.stop ? n.stop() : n.disconnect(); } catch (e) {}
        });
        synthNodes = [];
        if (synthTimer) {
          clearInterval(synthTimer);
          synthTimer = null;
        }
        if (analyser) {
          try { analyser.disconnect(); } catch (e) {}
        }
        if (micStream) {
          micStream.getTracks().forEach(t => t.stop());
          micStream = null;
        }
        if (audioElement) {
          audioElement.pause();
          audioElement = null;
        }

        btnSynth.classList.remove('active');
        btnMic.classList.remove('active');
        statusDot.classList.remove('active');
        activeSourceType = null;
      }

      // 1. Φ Synth v2
      btnSynth.addEventListener('click', () => {
        if (activeSourceType === 'synth') {
          stopCurrentAudio();
          return;
        }
        stopCurrentAudio();
        initAudio();

        const master = audioCtx.createGain();
        master.gain.value = 0.28;
        master.connect(analyser);
        analyser.connect(audioCtx.destination);

        const baseFreq = 55;
        [1, PHI, PHI * PHI, PHI * 2].forEach((ratio, idx) => {
          const osc = audioCtx.createOscillator();
          const filter = audioCtx.createBiquadFilter();
          const gain = audioCtx.createGain();

          osc.type = idx % 2 === 0 ? 'sawtooth' : 'triangle';
          osc.frequency.value = baseFreq * ratio;
          osc.detune.value = (idx - 1.5) * 6;

          filter.type = 'lowpass';
          filter.frequency.value = 320 * ratio;
          filter.Q.value = 3.5;

          gain.gain.value = 0.22 / (idx + 1);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(master);
          osc.start();
          synthNodes.push(osc, filter, gain);
        });

        let step = 0;
        const fibScale = [1, PHI, PHI * 1.25, PHI * PHI, PHI * 2, PHI * 2.5, PHI * PHI * PHI];

        synthTimer = setInterval(() => {
          if (!audioCtx || activeSourceType !== 'synth') return;
          const now = audioCtx.currentTime;

          if (step % 2 === 0) {
            const kick = audioCtx.createOscillator();
            const kGain = audioCtx.createGain();
            kick.frequency.setValueAtTime(125, now);
            kick.frequency.exponentialRampToValueAtTime(34, now + 0.24);
            kGain.gain.setValueAtTime(0.65, now);
            kGain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
            kick.connect(kGain);
            kGain.connect(analyser);
            kick.start(now);
            kick.stop(now + 0.3);
          }

          const pluck = audioCtx.createOscillator();
          const pFilter = audioCtx.createBiquadFilter();
          const pGain = audioCtx.createGain();

          const harmonic = fibScale[(step * 3) % fibScale.length];
          pluck.type = 'sawtooth';
          pluck.frequency.setValueAtTime(110 * harmonic, now);

          pFilter.type = 'bandpass';
          pFilter.frequency.setValueAtTime(900 * harmonic, now);
          pFilter.Q.value = 4.0;

          pGain.gain.setValueAtTime(0.24, now);
          pGain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

          pluck.connect(pFilter);
          pFilter.connect(pGain);
          pGain.connect(master);
          pluck.start(now);
          pluck.stop(now + 0.26);

          step++;
        }, 260);

        activeSourceType = 'synth';
        btnSynth.classList.add('active');
        statusDot.classList.add('active');
      });

      // 2. Live Microphone Input
      btnMic.addEventListener('click', async () => {
        if (activeSourceType === 'mic') {
          stopCurrentAudio();
          return;
        }
        stopCurrentAudio();
        initAudio();
        try {
          micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const src = audioCtx.createMediaStreamSource(micStream);
          src.connect(analyser);
          synthNodes.push(src);
          activeSourceType = 'mic';
          btnMic.classList.add('active');
          statusDot.classList.add('active');
        } catch (err) {
          alert('Microphone access denied or unavailable.');
        }
      });

      // 3. Audio File Loader
      audioFileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        stopCurrentAudio();
        initAudio();

        const url = URL.createObjectURL(file);
        audioElement = new Audio(url);
        audioElement.loop = true;
        audioElement.play();

        const src = audioCtx.createMediaElementSource(audioElement);
        src.connect(analyser);
        analyser.connect(audioCtx.destination);
        synthNodes.push(src);

        activeSourceType = 'file';
        statusDot.classList.add('active');
      });

      // Auto-Tune Toggle
      btnAuto.addEventListener('click', () => {
        autoTune = !autoTune;
        btnAuto.classList.toggle('active', autoTune);
        btnAuto.textContent = `Auto-Tune: ${autoTune ? 'ON' : 'OFF'}`;
        badgeAuto.textContent = `AGC AUTO-TUNE: ${autoTune ? 'ON' : 'MANUAL'}`;
      });

      // Theme Switcher
      btnTheme.addEventListener('click', () => {
        themeIdx = (themeIdx + 1) % THEMES.length;
        btnTheme.textContent = `Theme: ${THEMES[themeIdx].name}`;
      });

      // Manual Sliders
      nodeSlider.addEventListener('input', (e) => {
        if (autoTune) btnAuto.click();
        nodeCount = parseInt(e.target.value, 10);
        targetNodes = nodeCount;
      });

      tensionSlider.addEventListener('input', (e) => {
        if (autoTune) btnAuto.click();
        tension = parseInt(e.target.value, 10) / 100;
        targetTension = tension;
      });

      // Main 60FPS Render Loop
      function render(now) {
        requestAnimationFrame(render);
        const t = now * 0.001;
        const palette = THEMES[themeIdx];
        const maxRadius = minDim * 0.44;

        // 1. Extract & Smooth Audio DSP Features
        let rawBass = 0, rawMid = 0, rawHigh = 0, weightedSum = 0, totalSum = 0;

        if (analyser && activeSourceType) {
          analyser.getByteFrequencyData(freqData);
          analyser.getByteTimeDomainData(timeData);

          for (let i = 1; i < 360; i++) {
            const val = freqData[i] / 255;
            if (i <= 12) rawBass += val;
            else if (i <= 65) rawMid += val;
            else rawHigh += val;

            weightedSum += i * val;
            totalSum += val;
          }
          rawBass /= 12;
          rawMid /= 53;
          rawHigh /= 294;

          const instantSignal = Math.min(1, (rawBass * 1.6 + rawMid * 1.4 + rawHigh) * 1.5);
          audioGate += (instantSignal - audioGate) * (instantSignal > audioGate ? 0.35 : 0.08);
        } else {
          rawBass = (Math.sin(t * PHI * 1.8) * 0.5 + 0.5) * 0.24;
          rawMid = (Math.cos(t * 2.2) * 0.5 + 0.5) * 0.18;
          rawHigh = (Math.sin(t * PHI * PHI) * 0.5 + 0.5) * 0.12;
          weightedSum = (rawBass * 10 + rawMid * 50 + rawHigh * 180);
          totalSum = rawBass + rawMid + rawHigh + 0.01;
          audioGate *= 0.9;
        }

        const rawCentroid = totalSum > 0.001 ? Math.min(1, (weightedSum / totalSum) / 140) : 0.25;

        smoothBass += (rawBass - smoothBass) * (rawBass > smoothBass ? 0.35 : 0.1);
        smoothMid += (rawMid - smoothMid) * 0.15;
        smoothHigh += (rawHigh - smoothHigh) * 0.22;
        smoothCentroid += (rawCentroid - smoothCentroid) * 0.1;

        // 2. Transient Beat Detection
        const currentEnergy = rawBass * 0.65 + rawMid * 0.35;
        const avgEnergy = energyHistory.reduce((a, b) => a + b, 0) / energyHistory.length;
        energyHistory.push(currentEnergy);
        energyHistory.shift();

        if (beatCooldown > 0) beatCooldown--;
        if (currentEnergy > avgEnergy * 1.3 && currentEnergy > 0.14 && beatCooldown === 0) {
          beatFlash = 1.0;
          beatCooldown = 12;
          badgeBeat.textContent = 'TRANSIENT: LOCKED';
          badgeBeat.style.borderColor = '#ecc964';
        } else if (beatCooldown === 0) {
          badgeBeat.textContent = 'TRANSIENT: SYNC';
          badgeBeat.style.borderColor = 'rgba(236, 201, 100, 0.25)';
        }
        beatFlash *= 0.88;

        // 3. AGC Auto-Tune Controller
        if (autoTune) {
          targetNodes = Math.round(380 + (smoothMid * 240) + (smoothHigh * 140));
          nodeCount = Math.round(nodeCount + (targetNodes - nodeCount) * 0.08);
          nodeSlider.value = nodeCount;

          targetTension = 0.5 + smoothBass * 0.4 + beatFlash * 0.1;
          tension += (targetTension - tension) * 0.1;
          tensionSlider.value = Math.round(tension * 100);
        }

        // High-Energy Speed & Phase Progression
        const currentAngle = GOLDEN_ANGLE + (smoothBass * 0.0008) * smoothMid * tension;
        const speed = (0.0045 + smoothBass * 0.015) * (0.7 + tension * 0.5);
        phase += speed;

        // 4. Canvas Clear with Trail Accumulation
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = 'rgba(5, 5, 7, 0.26)';
        ctx.fillRect(0, 0, width, height);

        ctx.save();
        ctx.translate(cx, cy);
        ctx.globalCompositeOperation = 'lighter';

        const pRgb = palette.primary;
        const sRgb = palette.secondary;
        const aRgb = palette.accent;

        // 5. Ambient Core Nebula
        const coreGrad = ctx.createRadialGradient(0, 0, 1, 0, 0, maxRadius * (0.42 + smoothBass * 0.35));
        coreGrad.addColorStop(0, `rgba(${pRgb[0]}, ${pRgb[1]}, ${pRgb[2]}, ${0.12 + smoothBass * 0.18})`);
        coreGrad.addColorStop(0.6, `rgba(${sRgb[0]}, ${sRgb[1]}, ${sRgb[2]}, ${0.03 + smoothMid * 0.06})`);
        coreGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = coreGrad;
        ctx.beginPath();
        ctx.arc(0, 0, maxRadius, 0, Math.PI * 2);
        ctx.fill();

        // 6. Matte Continuous 2D Golden Spiral
        ctx.beginPath();
        for (let i = 0; i <= 280; i++) {
          const pct = i / 280;
          const th = pct * Math.PI * 8.0 - phase * 1.5;
          const baseR = 3.0 * Math.exp(LOG_PHI * (pct * Math.PI * 8.0));
          if (baseR > maxRadius * 1.15) break;

          const idx = Math.floor(pct * 128);
          const wave = activeSourceType ? (timeData[idx] - 128) / 128 : Math.sin(pct * 25 - t * 4) * 0.1;
          const r = baseR + wave * 18 * tension * (0.5 + smoothBass * 0.5);
          const x = r * Math.cos(th);
          const y = r * Math.sin(th);

          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.strokeStyle = `rgba(${pRgb[0]}, ${pRgb[1]}, ${pRgb[2]}, ${0.35 + smoothMid * 0.35})`;
        ctx.lineWidth = 1.2 + smoothBass * 1.6;
        ctx.stroke();

        // 7. Compute 2D Phyllotaxis Node Positions
        const nodes = new Array(nodeCount);
        for (let i = 0; i < nodeCount; i++) {
          const norm = i / nodeCount;
          const bin = Math.floor(norm * 160);
          const prime = i % 13 === 0;
          const e = activeSourceType
            ? freqData[bin] / 255
            : (Math.sin(norm * 10 - phase) * 0.5 + 0.5) * 0.22;

          const r = Math.sqrt(norm) * maxRadius + e * 26 * tension;
          const th = i * currentAngle - phase * 0.5;
          const x = r * Math.cos(th);
          const y = r * Math.sin(th);

          nodes[i] = { x, y, r, th, e, norm, prime };
        }

        // 8. Audio-Gated Connecting Dots (Fibonacci Parastichy Web: F_13, F_21, F_8)
        let activeLinks = 0;
        if (activeSourceType && audioGate > 0.02) {
          const gate = Math.max(0.08, 0.22 - tension * 0.14);
          ctx.lineWidth = 0.75 + smoothBass * 0.6;

          for (let i = 0; i < nodeCount; i++) {
            const n1 = nodes[i];
            if (n1.e > gate) {
              // Primary Golden Spiral Arm (i + 13)
              if (i + 13 < nodeCount) {
                const n2 = nodes[i + 13];
                const alpha = Math.min(0.68, (n1.e - gate) * 1.35 * audioGate);
                if (alpha > 0.02) {
                  ctx.strokeStyle = `rgba(${pRgb[0]}, ${pRgb[1]}, ${pRgb[2]}, ${alpha})`;
                  ctx.beginPath();
                  ctx.moveTo(n1.x, n1.y);
                  ctx.lineTo(n2.x, n2.y);
                  ctx.stroke();
                  activeLinks++;
                }
              }

              // Counter-Rotating Geometric Web (i + 21)
              if (i + 21 < nodeCount && n1.e > gate + 0.1) {
                const n3 = nodes[i + 21];
                const alpha = Math.min(0.48, (n1.e - gate) * 0.95 * audioGate);
                if (alpha > 0.02) {
                  ctx.strokeStyle = `rgba(${sRgb[0]}, ${sRgb[1]}, ${sRgb[2]}, ${alpha})`;
                  ctx.beginPath();
                  ctx.moveTo(n1.x, n1.y);
                  ctx.lineTo(n3.x, n3.y);
                  ctx.stroke();
                  activeLinks++;
                }
              }

              // Inner Core Sub-Bass Web (i + 8)
              if (i + 8 < nodeCount && n1.norm < 0.45 && smoothBass > 0.2) {
                const n4 = nodes[i + 8];
                const alpha = Math.min(0.42, smoothBass * 0.65 * (1 - n1.norm) * audioGate);
                if (alpha > 0.02) {
                  ctx.strokeStyle = `rgba(${aRgb[0]}, ${aRgb[1]}, ${aRgb[2]}, ${alpha * 0.6})`;
                  ctx.beginPath();
                  ctx.moveTo(n1.x, n1.y);
                  ctx.lineTo(n4.x, n4.y);
                  ctx.stroke();
                  activeLinks++;
                }
              }
            }
          }
        }

        // 9. Render Nodes
        for (let i = 0; i < nodeCount; i++) {
          const n = nodes[i];
          const sz = 1.0 + n.e * 3.2 + (n.prime ? 0.65 : 0);
          const alpha = 0.14 + (n.prime ? 0.45 : 0.12) + n.e * 0.38;

          if (n.prime && (n.e > 0.2 || !activeSourceType)) {
            const tailLen = (0.05 + smoothMid * 0.12) * (1 - n.norm * 0.4);
            ctx.strokeStyle = `rgba(${pRgb[0]}, ${pRgb[1]}, ${pRgb[2]}, ${alpha * 0.45})`;
            ctx.lineWidth = sz * 0.6;
            ctx.beginPath();
            ctx.arc(0, 0, n.r, n.th, n.th + tailLen);
            ctx.stroke();
          }

          ctx.beginPath();
          ctx.arc(n.x, n.y, Math.max(0.5, sz), 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${n.e > 0.65 ? aRgb[0] : n.prime ? pRgb[0] : sRgb[0]}, ${n.e > 0.65 ? aRgb[1] : n.prime ? pRgb[1] : sRgb[1]}, ${e = n.e > 0.65 ? aRgb[2] : n.prime ? pRgb[2] : sRgb[2]}, ${alpha})`;
          ctx.fill();
        }

        // Update HUD Matrix
        telAngle.textContent = ((currentAngle * 180) / Math.PI).toFixed(4) + '°';
        telBass.textContent = (smoothBass * 100).toFixed(1) + '%';
        telCentroid.textContent = (smoothCentroid * 100).toFixed(1) + '%';
        telNodes.textContent = nodeCount;
        telZ.textContent = activeLinks;

        ctx.restore();
      }

      requestAnimationFrame(render);
    })();
  </script>
</body>
</html>
