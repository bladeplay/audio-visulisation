<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SonicSpectrum Visualizer</title>
    <style>
        /* --- RESET & VARIABLES --- */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        :root {
            --bg-base: #030206;
            --panel-bg: rgba(18, 18, 32, 0.75);
            --panel-border: rgba(255, 255, 255, 0.08);
            --cyber-cyan: #00f3ff;
            --cyber-magenta: #ff0055;
            --cyber-purple: #9d00ff;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
        }

        .concert-bg {
            transition: background-color 0.05s ease-out;
        }

        /* --- HEADER --- */
        header {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            background: rgba(10, 10, 18, 0.85);
            border-bottom: 1px solid var(--panel-border);
            backdrop-filter: blur(12px);
            z-index: 20;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: rgba(0, 243, 255, 0.12);
            border: 1px solid rgba(0, 243, 255, 0.3);
            color: var(--cyber-cyan);
        }

        .brand-title {
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, var(--cyber-cyan), var(--cyber-purple), var(--cyber-magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: rgba(18, 18, 32, 0.8);
            border: 1px solid var(--panel-border);
            color: var(--text-dim);
            font-weight: 600;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #64748b;
        }

        .status-dot.active-mic {
            background: var(--cyber-cyan);
            box-shadow: 0 0 8px var(--cyber-cyan);
        }

        .status-dot.active-file {
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        /* --- WORKSPACE --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
            overflow: hidden;
            min-height: 0;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
        }

        @media (min-width: 1024px) {
            main {
                flex-direction: row;
                padding: 16px;
                gap: 16px;
            }
        }

        /* --- CANVAS CONTAINER --- */
        #canvasContainer {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #06050a;
            border-radius: 14px;
            border: 1px solid rgba(0, 243, 255, 0.2);
            overflow: hidden;
            min-height: 0;
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.08);
        }

        #visualizerCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 10;
        }

        .level-meter-wrapper {
            position: absolute;
            bottom: 8px;
            left: 12px;
            right: 12px;
            height: 5px;
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--panel-border);
            overflow: hidden;
            z-index: 20;
        }

        #inputLevelBar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #10b981, var(--cyber-cyan), var(--cyber-magenta));
            border-radius: 8px;
            transition: width 0.06s ease-out;
        }

        /* --- OVERLAYS --- */
        .overlay-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            z-index: 30;
            background: rgba(3, 2, 6, 0.7);
            backdrop-filter: blur(8px);
            transition: opacity 0.25s ease;
        }

        .overlay-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay-icon-box {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(0, 243, 255, 0.12);
            border: 1px solid rgba(0, 243, 255, 0.25);
            color: var(--cyber-cyan);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 12px;
        }

        .overlay-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .overlay-desc {
            font-size: 0.75rem;
            color: var(--text-dim);
            max-width: 260px;
        }

        #errorOverlay {
            background: rgba(3, 2, 6, 0.95);
        }

        .error-detail-box {
            background: rgba(18, 18, 32, 0.9);
            border: 1px solid rgba(255, 0, 85, 0.25);
            border-radius: 8px;
            padding: 10px;
            margin: 12px 0;
            font-size: 0.75rem;
            text-align: left;
            max-width: 320px;
            line-height: 1.4;
        }

        /* --- CONTROL DECK --- */
        .controls-deck {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 20;
        }

        @media (min-width: 1024px) {
            .controls-deck {
                width: 310px;
            }
        }

        .panel-box {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 10px;
        }

        /* Action Buttons */
        .actions-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn {
            appearance: none;
            border: none;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 14px;
            transition: all 0.15s ease;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-cyan {
            background: linear-gradient(135deg, var(--cyber-cyan), #0077ff);
            color: #030206;
            flex: 1;
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--cyber-magenta), #e11d48) !important;
            color: #ffffff !important;
        }

        .btn-slate {
            background: #1e293b;
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex: 1;
        }

        .btn-icon-square {
            width: 38px;
            height: 38px;
            padding: 0;
            background: #1e293b;
            color: var(--text-dim);
            border: 1px solid rgba(255, 255, 255, 0.1);
            flex-shrink: 0;
        }

        .btn-icon-square:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* Mode Presets */
        .modes-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .mode-btn {
            background: rgba(18, 18, 32, 0.5);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 8px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-dim);
            font-size: 0.65rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .mode-btn:active {
            transform: scale(0.95);
        }

        .mode-btn.active {
            border-color: rgba(0, 243, 255, 0.4);
            background: rgba(0, 243, 255, 0.08);
            color: var(--cyber-cyan);
        }

        /* Track Info */
        .track-indicator {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 243, 255, 0.06);
            border: 1px solid rgba(0, 243, 255, 0.15);
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.7rem;
        }

        .track-name-wrap {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--cyber-cyan);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Expandable Settings */
        .settings-toggle-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            padding: 2px 0;
        }

        .settings-content {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid var(--panel-border);
        }

        .settings-content.open {
            display: flex;
        }

        .toggles-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .toggle-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 10, 18, 0.6);
            border: 1px solid var(--panel-border);
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 0.68rem;
            font-weight: 600;
        }

        .theme-select-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 4px;
        }

        .theme-swatch {
            height: 24px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            cursor: pointer;
        }

        .theme-swatch.active {
            border: 2px solid var(--cyber-cyan);
            box-shadow: 0 0 8px rgba(0, 243, 255, 0.35);
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.68rem;
            color: var(--text-dim);
        }

        input[type="range"] {
            appearance: none;
            width: 100%;
            height: 4px;
            border-radius: 2px;
            background: #1e293b;
            outline: none;
        }

        /* SVG Sizing */
        svg {
            display: inline-block;
            vertical-align: middle;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body id="bodyFrame" class="concert-bg">

    <!-- Top Navigation Header -->
    <header>
        <div class="brand-container">
            <div class="brand-icon">
                <svg width="18" height="18" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
            </div>
            <div class="brand-title">SONICSPECTRUM</div>
        </div>
        <div class="status-badge" id="statusBadge">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">System Idle</span>
        </div>
    </header>

    <!-- Visualizer Container -->
    <main>
        <div id="canvasContainer">
            <canvas id="visualizerCanvas"></canvas>

            <div class="level-meter-wrapper">
                <div id="inputLevelBar"></div>
            </div>

            <!-- Start State Prompt -->
            <div class="overlay-screen" id="placeholderOverlay">
                <div class="overlay-icon-box">
                    <svg width="24" height="24" viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                </div>
                <div class="overlay-title">Start the Experience</div>
                <div class="overlay-desc">Select Microphone or load an audio track below.</div>
            </div>

            <!-- Diagnostics Overlay -->
            <div class="overlay-screen hidden" id="errorOverlay">
                <div class="overlay-icon-box" style="border-color: rgba(255,0,85,0.4); color: var(--cyber-magenta);">
                    <svg width="24" height="24" viewBox="0 0 24 24"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                </div>
                <div class="overlay-title" id="errorTitle">Action Required</div>
                <div class="error-detail-box" id="errorDetailBlock"></div>
                <button class="btn btn-slate" id="dismissError" style="flex: 0; padding: 6px 16px;">Dismiss</button>
            </div>
        </div>

        <!-- User Controls Deck -->
        <div class="controls-deck">
            
            <!-- Audio Trigger Bar -->
            <div class="panel-box actions-row">
                <button class="btn btn-cyan" id="toggleMicBtn">
                    <svg width="15" height="15" viewBox="0 0 24 24" id="micIcon"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                    <span id="micBtnText">Use Mic</span>
                </button>
                <div style="flex: 1; position: relative;">
                    <input type="file" id="audioFileInput" accept="audio/*" style="display: none;">
                    <button class="btn btn-slate" id="fileBtn" style="width: 100%;">
                        <svg width="15" height="15" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
                        <span id="fileBtnText">Load File</span>
                    </button>
                </div>
                <button class="btn btn-icon-square" id="freezeBtn" disabled title="Freeze Frame">
                    <svg width="15" height="15" viewBox="0 0 24 24" id="freezeIcon"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                </button>
            </div>

            <!-- Presets Bar -->
            <div class="modes-grid">
                <button class="mode-btn active" data-mode="bars">
                    <svg width="16" height="16" viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="10"></line><line x1="18" y1="20" x2="18" y2="4"></line><line x1="6" y1="20" x2="6" y2="16"></line></svg>
                    <span>Bars</span>
                </button>
                <button class="mode-btn" data-mode="wave">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path d="M2 12h2a2 2 0 0 1 2-2 2 2 0 0 1 2 2h2a2 2 0 0 1 2-2 2 2 0 0 1 2 2h2a2 2 0 0 1 2-2 2 2 0 0 1 2 2h2"></path></svg>
                    <span>Wave</span>
                </button>
                <button class="mode-btn" data-mode="radial">
                    <svg width="16" height="16" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
                    <span>Radial</span>
                </button>
                <button class="mode-btn" data-mode="particles">
                    <svg width="16" height="16" viewBox="0 0 24 24"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"></path></svg>
                    <span>Particles</span>
                </button>
            </div>

            <!-- Active Audio Track Metadata -->
            <div class="track-indicator" id="playingTrackIndicator">
                <div class="track-name-wrap">
                    <svg width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
                    <span id="currentTrackLabel">Track</span>
                </div>
                <span id="peakDbDisplay" style="font-family: monospace; font-size: 0.65rem; color: var(--text-dim);">PEAK: -INF dB</span>
            </div>

            <!-- Configurations Accordion -->
            <div class="panel-box">
                <button class="settings-toggle-btn" id="settingsHeaderBtn">
                    <span style="display: flex; align-items: center; gap: 6px;">
                        <svg width="14" height="14" viewBox="0 0 24 24" style="color: var(--cyber-cyan);"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
                        Settings & Sync
                    </span>
                    <svg width="14" height="14" viewBox="0 0 24 24" id="settingsChevron"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </button>

                <div class="settings-content" id="settingsExpandedPanel">
                    <div class="toggles-row">
                        <label class="toggle-item">
                            <span>Concert Light</span>
                            <input type="checkbox" id="concertLightToggle" checked>
                        </label>
                        <label class="toggle-item">
                            <span>Neon Glow</span>
                            <input type="checkbox" id="glowToggle" checked>
                        </label>
                    </div>

                    <div class="toggles-row" style="grid-template-columns: 1fr;">
                        <label class="toggle-item">
                            <span>Symmetric Mirror (Bars)</span>
                            <input type="checkbox" id="mirrorToggle" checked>
                        </label>
                    </div>

                    <div>
                        <div class="slider-label">
                            <span>Color Scheme</span>
                            <span id="currentThemeName" style="color: var(--cyber-cyan); font-weight: 700;">Cyberpunk</span>
                        </div>
                        <div class="theme-select-grid">
                            <button class="theme-swatch active" data-theme="cyberpunk" style="background: linear-gradient(90deg, #00f3ff, #ff0055);"></button>
                            <button class="theme-swatch" data-theme="neon" style="background: linear-gradient(90deg, #10b981, #064e3b);"></button>
                            <button class="theme-swatch" data-theme="sunset" style="background: linear-gradient(90deg, #f59e0b, #8b5cf6);"></button>
                            <button class="theme-swatch" data-theme="monochrome" style="background: linear-gradient(90deg, #f8fafc, #334155);"></button>
                        </div>
                    </div>

                    <div class="slider-group">
                        <div class="slider-label">
                            <span>Sensitivity Gain</span>
                            <span id="gainVal" style="font-family: monospace; color: var(--cyber-cyan);">1.5x</span>
                        </div>
                        <input type="range" id="gainControl" min="0.5" max="4.0" step="0.1" value="1.5">
                    </div>

                    <div class="slider-group">
                        <div class="slider-label">
                            <span>Signal Smoothing</span>
                            <span id="smoothingVal" style="font-family: monospace; color: var(--cyber-cyan);">0.85</span>
                        </div>
                        <input type="range" id="smoothingControl" min="0.1" max="0.95" step="0.05" value="0.85">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- CORE LOGIC & ENGINE -->
    <script>
        // System State
        const state = {
            isListening: false,
            isFrozen: false,
            activeSource: null,
            mode: 'bars',
            theme: 'cyberpunk',
            gain: 1.5,
            fftSize: window.innerWidth < 768 ? 64 : 128,
            smoothing: 0.85,
            glow: true,
            mirror: true,
            concertLight: true,
            bgCycleHue: 0
        };

        const themes = {
            cyberpunk: { 
                name: 'Cyberpunk', 
                primary: '#00f3ff', 
                secondary: '#ff0055', 
                getGradient: (ctx, h) => { 
                    const g = ctx.createLinearGradient(0, h, 0, 0); 
                    g.addColorStop(0, '#9d00ff'); 
                    g.addColorStop(0.5, '#ff0055'); 
                    g.addColorStop(1, '#00f3ff'); 
                    return g; 
                } 
            },
            neon: { 
                name: 'Neon Green', 
                primary: '#10b981', 
                secondary: '#34d399', 
                getGradient: (ctx, h) => { 
                    const g = ctx.createLinearGradient(0, h, 0, 0); 
                    g.addColorStop(0, '#064e3b'); 
                    g.addColorStop(0.5, '#10b981'); 
                    g.addColorStop(1, '#a7f3d0'); 
                    return g; 
                } 
            },
            sunset: { 
                name: 'Sunset Fire', 
                primary: '#f59e0b', 
                secondary: '#f43f5e', 
                getGradient: (ctx, h) => { 
                    const g = ctx.createLinearGradient(0, h, 0, 0); 
                    g.addColorStop(0, '#8b5cf6'); 
                    g.addColorStop(0.5, '#f43f5e'); 
                    g.addColorStop(1, '#fef08a'); 
                    return g; 
                } 
            },
            monochrome: { 
                name: 'Monochrome', 
                primary: '#f8fafc', 
                secondary: '#94a3b8', 
                getGradient: (ctx, h) => { 
                    const g = ctx.createLinearGradient(0, h, 0, 0); 
                    g.addColorStop(0, '#334155'); 
                    g.addColorStop(0.5, '#94a3b8'); 
                    g.addColorStop(1, '#f8fafc'); 
                    return g; 
                } 
            }
        };

        let audioCtx, analyserNode, gainNode, micStream, micSourceNode, fileSourceNode, audioPlayNode, animationFrameId;
        let particles = [], peakCaps = [];
        let beatCutoff = 0, beatDecayRate = 0.96, strobePulse = 0;

        // Element Selectors
        const dom = {
            bodyFrame: document.getElementById('bodyFrame'),
            canvas: document.getElementById('visualizerCanvas'),
            canvasContainer: document.getElementById('canvasContainer'),
            toggleMicBtn: document.getElementById('toggleMicBtn'),
            micBtnText: document.getElementById('micBtnText'),
            audioFileInput: document.getElementById('audioFileInput'),
            fileBtn: document.getElementById('fileBtn'),
            fileBtnText: document.getElementById('fileBtnText'),
            freezeBtn: document.getElementById('freezeBtn'),
            placeholderOverlay: document.getElementById('placeholderOverlay'),
            errorOverlay: document.getElementById('errorOverlay'),
            errorTitle: document.getElementById('errorTitle'),
            errorDetailBlock: document.getElementById('errorDetailBlock'),
            dismissError: document.getElementById('dismissError'),
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText'),
            peakDbDisplay: document.getElementById('peakDbDisplay'),
            inputLevelBar: document.getElementById('inputLevelBar'),
            gainControl: document.getElementById('gainControl'),
            gainVal: document.getElementById('gainVal'),
            smoothingControl: document.getElementById('smoothingControl'),
            smoothingVal: document.getElementById('smoothingVal'),
            glowToggle: document.getElementById('glowToggle'),
            mirrorToggle: document.getElementById('mirrorToggle'),
            concertLightToggle: document.getElementById('concertLightToggle'),
            settingsHeaderBtn: document.getElementById('settingsHeaderBtn'),
            settingsExpandedPanel: document.getElementById('settingsExpandedPanel'),
            settingsChevron: document.getElementById('settingsChevron'),
            playingTrackIndicator: document.getElementById('playingTrackIndicator'),
            currentTrackLabel: document.getElementById('currentTrackLabel'),
            currentThemeName: document.getElementById('currentThemeName')
        };
        const ctx = dom.canvas.getContext('2d');

        function resizeCanvas() {
            const rect = dom.canvasContainer.getBoundingClientRect();
            const r = Math.min(window.devicePixelRatio || 1, 2);
            dom.canvas.width = rect.width * r;
            dom.canvas.height = rect.height * r;
            ctx.resetTransform();
            ctx.scale(r, r);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function initAudioEngine() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyserNode = audioCtx.createAnalyser();
                gainNode = audioCtx.createGain();
                analyserNode.fftSize = state.fftSize * 2;
                analyserNode.smoothingTimeConstant = state.smoothing;
                gainNode.gain.value = state.gain;
                gainNode.connect(analyserNode);
            }
        }

        async function startMicrophone() {
            initAudioEngine();
            disconnectFileSource();

            if (!window.isSecureContext) {
                return showDiagnosticError("Insecure Context", "Microphone access requires a secure connection (HTTPS or localhost).");
            }
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                return showDiagnosticError("Unsupported Device", "Web Audio API is not supported in this browser. Please open in native Safari or Chrome.");
            }

            try {
                if (audioCtx.state === 'suspended') await audioCtx.resume();
                try {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
                } catch (e) {
                    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                }

                micSourceNode = audioCtx.createMediaStreamSource(micStream);
                micSourceNode.connect(gainNode);

                state.isListening = true;
                state.activeSource = 'mic';
                updateSourceUI();

                dom.placeholderOverlay.classList.add('hidden');
                dom.errorOverlay.classList.add('hidden');
                dom.freezeBtn.disabled = false;
                resizeCanvas();
                draw();
            } catch (err) {
                let msg = err.message || err.name;
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    msg = "Microphone access was denied. Enable mic permissions in your phone/system settings and refresh.";
                }
                showDiagnosticError("Mic Blocked", msg);
                stopAllAudio();
            }
        }

        function showDiagnosticError(title, html) {
            dom.errorTitle.textContent = title;
            dom.errorDetailBlock.innerHTML = html;
            dom.errorOverlay.classList.remove('hidden');
        }

        function disconnectFileSource() {
            if (audioPlayNode) {
                try { audioPlayNode.stop(); } catch(e) {}
                audioPlayNode = null;
            }
            if (fileSourceNode) {
                fileSourceNode.disconnect();
                fileSourceNode = null;
            }
            dom.playingTrackIndicator.style.display = 'none';
            dom.fileBtn.className = "btn btn-slate";
            dom.fileBtnText.textContent = "Load File";
        }

        function disconnectMicSource() {
            if (micStream) {
                micStream.getTracks().forEach(t => t.stop());
                micStream = null;
            }
            if (micSourceNode) {
                micSourceNode.disconnect();
                micSourceNode = null;
            }
            dom.toggleMicBtn.className = "btn btn-cyan";
            dom.micBtnText.textContent = "Use Mic";
        }

        function stopAllAudio() {
            disconnectMicSource();
            disconnectFileSource();
            state.isListening = false;
            state.isFrozen = false;
            state.activeSource = null;
            updateSourceUI();
            dom.placeholderOverlay.classList.remove('hidden');
            dom.freezeBtn.disabled = true;
            dom.bodyFrame.style.backgroundColor = '';
            if (dom.inputLevelBar) dom.inputLevelBar.style.width = '0%';
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            clearCanvas();
        }

        dom.audioFileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            initAudioEngine();
            disconnectMicSource();
            disconnectFileSource();

            const reader = new FileReader();
            reader.onload = async event => {
                try {
                    dom.statusText.textContent = "Decoding...";
                    const buffer = await audioCtx.decodeAudioData(event.target.result);
                    audioPlayNode = audioCtx.createBufferSource();
                    audioPlayNode.buffer = buffer;
                    audioPlayNode.connect(gainNode);
                    audioPlayNode.connect(audioCtx.destination);
                    audioPlayNode.onended = stopAllAudio;
                    audioPlayNode.start(0);

                    state.isListening = true;
                    state.activeSource = 'file';
                    dom.currentTrackLabel.textContent = file.name;
                    dom.playingTrackIndicator.style.display = 'flex';
                    updateSourceUI();

                    dom.placeholderOverlay.classList.add('hidden');
                    dom.errorOverlay.classList.add('hidden');
                    dom.freezeBtn.disabled = false;
                    resizeCanvas();
                    draw();
                } catch (err) {
                    showDiagnosticError("Decode Error", "Could not decode audio. Try using an MP3 or WAV file.");
                    stopAllAudio();
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function updateSourceUI() {
            if (state.activeSource === 'mic') {
                dom.toggleMicBtn.className = "btn btn-danger";
                dom.micBtnText.textContent = "Stop Mic";
                dom.statusDot.className = "status-dot active-mic";
                dom.statusText.textContent = "Live Mic";
            } else if (state.activeSource === 'file') {
                dom.fileBtn.className = "btn btn-danger";
                dom.fileBtnText.textContent = "Stop File";
                dom.statusDot.className = "status-dot active-file";
                dom.statusText.textContent = "Playing File";
            } else {
                dom.statusDot.className = "status-dot";
                dom.statusText.textContent = "System Idle";
            }
        }

        function clearCanvas() {
            const w = dom.canvas.width / (window.devicePixelRatio || 1);
            const h = dom.canvas.height / (window.devicePixelRatio || 1);
            ctx.clearRect(0, 0, w, h);
        }

        // Animation Loop
        function draw() {
            if (!state.isListening) return;
            animationFrameId = requestAnimationFrame(draw);
            if (state.isFrozen) return;

            const pixelRatio = window.devicePixelRatio || 1;
            const w = dom.canvas.width / pixelRatio;
            const h = dom.canvas.height / pixelRatio;
            const bufferLength = analyserNode.frequencyBinCount;
            const freqData = new Uint8Array(bufferLength);
            const timeData = new Uint8Array(bufferLength);

            analyserNode.getByteFrequencyData(freqData);
            analyserNode.getByteTimeDomainData(timeData);

            // Compute Volume RMS
            let sumSquares = 0, peakSample = 0;
            for (let i = 0; i < bufferLength; i++) {
                const norm = (timeData[i] - 128) / 128;
                sumSquares += norm * norm;
                if (freqData[i] > peakSample) peakSample = freqData[i];
            }
            const rms = Math.sqrt(sumSquares / bufferLength);
            const roomLoudness = Math.min(1.0, rms * 3.5);

            if (dom.inputLevelBar) {
                dom.inputLevelBar.style.width = `${Math.min(100, Math.round(roomLoudness * 100))}%`;
            }
            const db = peakSample > 0 ? Math.round(20 * Math.log10(peakSample / 255)) : -Infinity;
            dom.peakDbDisplay.textContent = `PEAK: ${db === -Infinity ? '-INF dB' : db + ' dB'}`;

            // Track Sub-bass Onsets
            let bassSum = 0;
            const bassBins = Math.max(2, Math.floor(bufferLength * 0.08));
            for (let i = 0; i < bassBins; i++) bassSum += freqData[i];
            const currentBass = (bassSum / bassBins) / 255;

            if (currentBass > beatCutoff && currentBass > 0.22) {
                strobePulse = 1.0;
                beatCutoff = currentBass * 1.25;
            } else {
                beatCutoff *= beatDecayRate;
                strobePulse = Math.max(0, strobePulse - 0.06);
            }

            // Radial Glow Background
            state.bgCycleHue = (state.bgCycleHue + 0.3 + (roomLoudness * 0.8)) % 360;
            let hue = state.bgCycleHue;
            if (state.theme === 'neon') hue = 140 + (currentBass * 30);
            if (state.theme === 'sunset') hue = 10 + (currentBass * 45);

            const gradRadius = Math.max(w, h) * (0.35 + (roomLoudness * 0.45) + (strobePulse * 0.2));
            const gradBg = ctx.createRadialGradient(w / 2, h / 2, 5, w / 2, h / 2, gradRadius);
            const lightLuminance = 6 + (roomLoudness * 22) + (strobePulse * 28);
            gradBg.addColorStop(0, `hsla(${hue}, 85%, ${Math.min(75, lightLuminance)}%, ${0.35 + roomLoudness * 0.5})`);
            gradBg.addColorStop(1, `hsla(${hue + 15}, 90%, 2%, 1)`);
            ctx.fillStyle = gradBg;
            ctx.fillRect(0, 0, w, h);

            if (state.concertLight) {
                const ambientAlpha = 0.05 + (roomLoudness * 0.28) + (strobePulse * 0.45);
                const ambientLightness = 20 + (strobePulse * 35);
                dom.bodyFrame.style.backgroundColor = `hsla(${hue}, 85%, ${ambientLightness}%, ${Math.min(0.85, ambientAlpha)})`;
            } else {
                dom.bodyFrame.style.backgroundColor = '#030206';
            }

            const displayData = (state.mode === 'wave') ? timeData : freqData;
            switch (state.mode) {
                case 'bars': renderBars(displayData, bufferLength, w, h, strobePulse); break;
                case 'wave': renderWaveform(displayData, bufferLength, w, h, strobePulse); break;
                case 'radial': renderRadial(displayData, bufferLength, w, h, strobePulse); break;
                case 'particles': renderParticles(displayData, bufferLength, w, h, roomLoudness + strobePulse); break;
            }
        }

        // Renderers
        function renderBars(a, b, w, h, beatBoost) {
            const t = themes[state.theme];
            const m = state.mirror;
            const c = Math.floor(b * 0.75);
            const i = m ? Math.floor(c / 2) : c;
            const g = window.innerWidth < 640 ? 1.5 : 3;
            const d = Math.max(1.5, (w / i) - g);
            ctx.shadowBlur = state.glow ? (12 + beatBoost * 14) : 0;
            ctx.shadowColor = t.primary;

            if (peakCaps.length !== i) {
                peakCaps = Array(i).fill(0).map(() => ({ val: 0, velocity: 0 }));
            }

            for (let n = 0; n < i; n++) {
                const v = a[n];
                const H = (v / 255) * (h * (0.65 + beatBoost * 0.15));
                ctx.fillStyle = t.getGradient(ctx, h);
                const p = peakCaps[n];
                if (H > p.val) {
                    p.val = H;
                    p.velocity = 0.6;
                } else {
                    p.velocity += 0.24;
                    p.val = Math.max(0, p.val - p.velocity);
                }

                if (m) {
                    const xL = (w / 2) - (n * (d + g)) - d;
                    const xR = (w / 2) + (n * (d + g));
                    const y = h - H - 15;
                    ctx.fillRect(xL, y, d, H);
                    ctx.fillRect(xR, y, d, H);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(xL, h - p.val - 18, d, 2);
                    ctx.fillRect(xR, h - p.val - 18, d, 2);
                } else {
                    const x = n * (d + g);
                    const y = h - H - 15;
                    ctx.fillRect(x, y, d, H);
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(x, h - p.val - 18, d, 2);
                }
            }
            ctx.shadowBlur = 0;
        }

        function renderWaveform(a, b, w, h, beatBoost) {
            const t = themes[state.theme];
            ctx.lineWidth = 3 + (beatBoost * 2);
            ctx.strokeStyle = t.primary;
            ctx.shadowBlur = state.glow ? (14 + beatBoost * 16) : 0;
            ctx.shadowColor = t.primary;
            ctx.beginPath();
            const s = w / b;
            let x = 0;
            for (let i = 0; i < b; i++) {
                const v = a[i] / 128;
                const y = (v * h) / 2;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
                x += s;
            }
            ctx.lineTo(w, h / 2);
            ctx.stroke();
            ctx.shadowBlur = 0;
        }

        function renderRadial(a, b, w, h, beatBoost) {
            const t = themes[state.theme];
            const x = w / 2, y = h / 2;
            const baseRadius = Math.min(w, h) * (window.innerWidth < 640 ? 0.18 : 0.22) * (1 + beatBoost * 0.12);
            ctx.shadowBlur = state.glow ? (12 + beatBoost * 14) : 0;
            ctx.shadowColor = t.primary;
            const c = Math.floor(b * (window.innerWidth < 640 ? 0.5 : 0.65));
            const s = (Math.PI * 2) / c;
            for (let i = 0; i < c; i++) {
                const A = a[i] / 255;
                const L = A * (Math.min(w, h) * 0.26);
                const g = i * s;
                const x1 = x + Math.cos(g) * baseRadius;
                const y1 = y + Math.sin(g) * baseRadius;
                const x2 = x + Math.cos(g) * (baseRadius + L);
                const y2 = y + Math.sin(g) * (baseRadius + L);
                ctx.strokeStyle = t.getGradient(ctx, h);
                ctx.lineWidth = window.innerWidth < 640 ? 2.5 : 3.5;
                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.stroke();
            }
            const vA = a.reduce((p, k) => p + k, 0) / b / 255;
            ctx.beginPath();
            ctx.arc(x, y, baseRadius * 0.85 + vA * 15, 0, Math.PI * 2);
            ctx.fillStyle = t.primary;
            ctx.globalAlpha = 0.25 + vA * 0.45;
            ctx.fill();
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        function renderParticles(a, b, w, h, intensity) {
            const t = themes[state.theme];
            const vA = a.reduce((p, k) => p + k, 0) / b / 255;
            const isMobile = window.innerWidth < 640;
            const maxCount = isMobile ? 80 : 200;
            if (vA > 0.08 && particles.length < maxCount) {
                const spawnCount = Math.min(isMobile ? 3 : 6, Math.ceil(vA * 8));
                for (let i = 0; i < spawnCount; i++) {
                    const g = Math.random() * Math.PI * 2;
                    const s = (Math.random() * 3 + 1) * (1 + intensity * 2);
                    particles.push({
                        x: w / 2,
                        y: h / 2,
                        vx: Math.cos(g) * s,
                        vy: Math.sin(g) * s - (vA * 0.3),
                        radius: Math.random() * 2.5 + 1,
                        alpha: 1,
                        color: Math.random() > 0.45 ? t.primary : t.secondary
                    });
                }
            }
            ctx.shadowBlur = state.glow ? 10 : 0;
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= isMobile ? 0.02 : 0.012;
                if (p.alpha <= 0 || p.x < 0 || p.x > w || p.y < 0 || p.y > h) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.shadowColor = p.color;
                ctx.fillStyle = p.color;
                ctx.globalAlpha = p.alpha;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
        }

        // --- Event Listeners ---
        dom.toggleMicBtn.addEventListener('click', () => { state.activeSource === 'mic' ? stopAllAudio() : startMicrophone(); });
        dom.fileBtn.addEventListener('click', () => { state.activeSource === 'file' ? stopAllAudio() : dom.audioFileInput.click(); });
        
        dom.freezeBtn.addEventListener('click', () => {
            state.isFrozen = !state.isFrozen;
            dom.freezeBtn.style.color = state.isFrozen ? 'var(--cyber-cyan)' : 'var(--text-dim)';
            dom.freezeBtn.style.borderColor = state.isFrozen ? 'var(--cyber-cyan)' : 'rgba(255, 255, 255, 0.1)';
        });

        dom.dismissError.addEventListener('click', () => dom.errorOverlay.classList.add('hidden'));

        dom.settingsHeaderBtn.addEventListener('click', () => {
            dom.settingsExpandedPanel.classList.toggle('open');
            const isOpen = dom.settingsExpandedPanel.classList.contains('open');
            dom.settingsChevron.style.transform = isOpen ? 'rotate(180deg)' : 'rotate(0deg)';
        });

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', e => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                const t = e.currentTarget;
                t.classList.add('active');
                state.mode = t.getAttribute('data-mode');
            });
        });

        document.querySelectorAll('.theme-swatch').forEach(swatch => {
            swatch.addEventListener('click', e => {
                document.querySelectorAll('.theme-swatch').forEach(s => s.classList.remove('active'));
                const t = e.currentTarget;
                t.classList.add('active');
                state.theme = t.getAttribute('data-theme');
                dom.currentThemeName.textContent = themes[state.theme].name;
            });
        });

        dom.gainControl.addEventListener('input', e => {
            state.gain = parseFloat(e.target.value);
            dom.gainVal.textContent = `${state.gain.toFixed(1)}x`;
            if (gainNode) gainNode.gain.value = state.gain;
        });

        dom.smoothingControl.addEventListener('input', e => {
            state.smoothing = parseFloat(e.target.value);
            dom.smoothingVal.textContent = state.smoothing.toFixed(2);
            if (analyserNode) analyserNode.smoothingTimeConstant = state.smoothing;
        });

        dom.glowToggle.addEventListener('change', e => state.glow = e.target.checked);
        dom.mirrorToggle.addEventListener('change', e => state.mirror = e.target.checked);
        dom.concertLightToggle.addEventListener('change', e => {
            state.concertLight = e.target.checked;
            if (!state.concertLight) dom.bodyFrame.style.backgroundColor = '#030206';
        });
    </script>
</body>
</html>
